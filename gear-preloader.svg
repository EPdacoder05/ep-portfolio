<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-label="Gear2Adhere">
  <style>
    .gear-body { fill: #31302f; }
    .g2a-gear { transform-box: fill-box; transform-origin: center; }
    .g2a-gear--lg { animation: g2a-ccw 4s linear infinite; }
    .g2a-gear--md { animation: g2a-cw 5.818s linear infinite; }
    .g2a-gear--sm { animation: g2a-cw 7.111s linear infinite; }
    @keyframes g2a-cw { to { transform: rotate(360deg); } }
    @keyframes g2a-ccw { to { transform: rotate(-360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .g2a-gear { animation: none; }
    }
  </style>
